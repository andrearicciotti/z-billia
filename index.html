<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo di Biliardino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { min-height: 100vh; }
body { background: #1a1a2e; }
</style>
<script src="torneo.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;
const SK_BIN = "torneo_jb_bin";

function App() {
  const [tab, setTab] = useState("gironi");
  const [results, setResults] = useState({});
  const [koResults, setKoResults] = useState({});
  const [binId, setBinId] = useState(() => localStorage.getItem(SK_BIN) || "");
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSync, setLastSync] = useState(null);
  const [binInput, setBinInput] = useState("");

  const roundsA = useMemo(() => generateRoundRobin(TEAMS_A), []);
  const roundsB = useMemo(() => generateRoundRobin(TEAMS_B), []);
  const configured = binId.length > 5;

  /* LOAD (public read, no API key) */
  const loadFromBin = useCallback(async (silent) => {
    if (!configured) return;
    if (!silent) setSyncStatus("loading");
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
        headers: { "Content-Type": "application/json" },
      });
      if (!r.ok) throw new Error(r.statusText);
      const d = await r.json();
      const rec = d.record || {};
      if (rec.results) setResults(rec.results);
      if (rec.koResults) setKoResults(rec.koResults);
      setLastSync(new Date()); setSyncStatus("saved");
    } catch (e) { console.error(e); if (!silent) setSyncStatus("error"); }
  }, [configured, binId]);

  useEffect(() => { if (configured) loadFromBin(); }, [configured]);

  function connect(id) {
    localStorage.setItem(SK_BIN, id);
    setBinId(id);
  }

  /* STANDINGS */
  const stA = useMemo(() => getStandings("A", results, roundsA, TEAMS_A), [results, roundsA]);
  const stB = useMemo(() => getStandings("B", results, roundsB, TEAMS_B), [results, roundsB]);
  const allDone = useMemo(() => allGroupMatchesPlayed(results, roundsA, roundsB), [results, roundsA, roundsB]);

  const koM = useMemo(() => !allDone ? [] : [
    { home:stA[2], away:stB[5], label:"3\u00b0A vs 6\u00b0B", id:"ko-0" },
    { home:stA[3], away:stB[4], label:"4\u00b0A vs 5\u00b0B", id:"ko-1" },
    { home:stA[4], away:stB[3], label:"5\u00b0A vs 4\u00b0B", id:"ko-2" },
    { home:stA[5], away:stB[2], label:"6\u00b0A vs 3\u00b0B", id:"ko-3" },
  ], [allDone, stA, stB]);

  const qfM = useMemo(() => { if (!allDone) return []; const kw=koM.map(m=>koResults[m.id]?.winner||null); return [
    { home:stA[0]?.name, away:kw[3], label:"QF1: 1\u00b0A vs vinc. 6\u00b0A\u20133\u00b0B", id:"qf-0" },
    { home:stA[1]?.name, away:kw[2], label:"QF2: 2\u00b0A vs vinc. 5\u00b0A\u20134\u00b0B", id:"qf-1" },
    { home:stB[0]?.name, away:kw[1], label:"QF3: 1\u00b0B vs vinc. 4\u00b0A\u20135\u00b0B", id:"qf-2" },
    { home:stB[1]?.name, away:kw[0], label:"QF4: 2\u00b0B vs vinc. 3\u00b0A\u20136\u00b0B", id:"qf-3" },
  ]; }, [allDone, koM, koResults, stA, stB]);

  const sfM = useMemo(() => [
    { home:koResults["qf-0"]?.winner||null, away:koResults["qf-1"]?.winner||null, label:"SF1: Vinc.QF1 vs Vinc.QF2", id:"sf-0" },
    { home:koResults["qf-2"]?.winner||null, away:koResults["qf-3"]?.winner||null, label:"SF2: Vinc.QF3 vs Vinc.QF4", id:"sf-1" },
  ], [koResults]);

  const fin = useMemo(() => ({ home:koResults["sf-0"]?.winner||null, away:koResults["sf-1"]?.winner||null, label:"FINALE", id:"final" }), [koResults]);

  /* STYLES */
  const s = {
    container: { fontFamily:"'Courier New', monospace", background:C.BG, color:C.TXT, minHeight:"100vh", padding:20 },
    header: { textAlign:"center", marginBottom:24 },
    title: { fontSize:28, fontWeight:900, letterSpacing:2, textTransform:"uppercase", background:`linear-gradient(90deg, ${C.A}, ${C.GOLD}, ${C.B})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginBottom:4 },
    subtitle: { fontSize:12, color:C.DIM, letterSpacing:4 },
    tabs: { display:"flex", justifyContent:"center", gap:8, marginBottom:24, flexWrap:"wrap" },
    tab: (on) => ({ padding:"8px 18px", fontSize:13, fontWeight:700, fontFamily:"'Courier New', monospace", border:`2px solid ${on?C.GOLD:C.DIM}`, background:on?C.GOLD:"transparent", color:on?C.BG:C.DIM, cursor:"pointer", textTransform:"uppercase", letterSpacing:1 }),
    gTitle: (c) => ({ fontSize:16, fontWeight:900, color:c, borderBottom:`2px solid ${c}`, paddingBottom:6, marginBottom:12, letterSpacing:2 }),
    mRow: { display:"flex", alignItems:"center", gap:6, marginBottom:8, fontSize:12 },
    teamName: (isW) => ({ flex:1, fontSize:11, fontWeight:isW?800:500, color:isW?C.GREEN:C.TXT, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }),
    scoreBox: { fontSize:10, color:C.DIM, minWidth:80, textAlign:"center", fontWeight:700 },
    vs: { fontSize:10, color:C.DIM, fontWeight:700, minWidth:20, textAlign:"center" },
    rLabel: { fontSize:11, color:C.GOLD, fontWeight:700, marginTop:12, marginBottom:6 },
    tbl: { width:"100%", borderCollapse:"collapse", fontSize:12, marginBottom:16 },
    th: { textAlign:"left", padding:"6px 6px", borderBottom:"1px solid #334", color:C.DIM, fontSize:10, fontWeight:700, letterSpacing:1 },
    thR: { textAlign:"right", padding:"6px 6px", borderBottom:"1px solid #334", color:C.DIM, fontSize:10, fontWeight:700, letterSpacing:1 },
    td: (h) => ({ padding:"6px 6px", borderBottom:"1px solid #1a2a3a", fontWeight:h?800:400, color:h?C.GOLD:C.TXT }),
    tdR: (h) => ({ padding:"6px 6px", borderBottom:"1px solid #1a2a3a", fontWeight:h?800:400, color:h?C.GOLD:C.TXT, textAlign:"right" }),
    pos: (p) => ({ padding:"6px 6px", borderBottom:"1px solid #1a2a3a", fontWeight:800, color:p<=2?C.GREEN:C.DIM }),
    card: { background:C.CARD, border:"1px solid #2a3a5a", padding:16, marginBottom:16 },
    twoCol: { display:"grid", gridTemplateColumns:window.innerWidth<700?"1fr":"1fr 1fr", gap:16 },
    sCol: { maxWidth:600, margin:"0 auto" },
    bM: { background:C.CARD2, border:"1px solid #2a3a5a", padding:10, marginBottom:8 },
    bL: { fontSize:10, color:C.DIM, marginBottom:6, letterSpacing:1, fontWeight:700 },
    bS: { marginBottom:24 },
    sT: { fontSize:14, fontWeight:900, letterSpacing:2, marginBottom:10, textTransform:"uppercase" },
    champ: { textAlign:"center", padding:20, background:`linear-gradient(135deg, ${C.CARD}, #2a2a1e)`, border:`2px solid ${C.GOLD}`, marginTop:8 },
    champN: { fontSize:22, fontWeight:900, color:C.GOLD, letterSpacing:2 },
    btn: { padding:"6px 14px", fontSize:11, fontFamily:"'Courier New', monospace", fontWeight:700, background:"transparent", border:"1px solid #555", color:C.DIM, cursor:"pointer", marginTop:8 },
    input: { width:"100%", padding:"8px 10px", fontFamily:"'Courier New', monospace", fontSize:12, background:"#0d1117", border:"1px solid #334", color:C.TXT, marginTop:4, marginBottom:12 },
    lbl: { fontSize:11, color:C.GOLD, fontWeight:700, letterSpacing:1 },
    sync: { display:"flex", alignItems:"center", justifyContent:"center", gap:12, padding:"6px 0", marginBottom:16, fontSize:11, color:C.DIM },
    dot: (c) => ({ width:8, height:8, borderRadius:"50%", background:c, display:"inline-block" }),
  };

  /* NOT CONNECTED */
  if (!configured) {
    return (<div style={s.container}>
      <div style={s.header}><div style={s.title}>Torneo di Biliardino</div><div style={s.subtitle}>12 squadre &bull; 2 gironi &bull; eliminazione diretta</div></div>
      <div style={{...s.card,maxWidth:440,margin:"40px auto",textAlign:"center"}}>
        <div style={{fontSize:14,fontWeight:900,color:C.GOLD,marginBottom:12,letterSpacing:2}}>COLLEGATI AL TORNEO</div>
        <div style={{fontSize:11,color:C.DIM,marginBottom:16,lineHeight:1.6}}>Inserisci il Bin ID fornito dall'organizzatore.</div>
        <label style={s.lbl}>BIN ID</label>
        <input style={s.input} value={binInput} onChange={e=>setBinInput(e.target.value)} placeholder="64a..." />
        <button style={{...s.btn,borderColor:C.GREEN,color:C.GREEN}} onClick={()=>connect(binInput)}>Connetti</button>
      </div>
    </div>);
  }

  /* SYNC BAR */
  function SyncBar() {
    const map = { idle:{c:C.DIM,t:"Non connesso"}, loading:{c:C.B,t:"Caricamento..."}, saved:{c:C.GREEN,t:"Aggiornato"}, error:{c:C.RED,t:"Errore"} };
    const st = map[syncStatus]||map.idle;
    return (<div style={s.sync}>
      <span style={s.dot(st.c)}></span><span>{st.t}</span>
      {lastSync && <span style={{color:"#556"}}>({lastSync.toLocaleTimeString("it-IT")})</span>}
      <button style={{...s.btn,marginTop:0,padding:"3px 8px",fontSize:10}} onClick={()=>loadFromBin()}>Ricarica</button>
    </div>);
  }

  /* RENDER */
  function renderGM(g, rounds, acc) {
    return (<div><div style={s.gTitle(acc)}>GIRONE {g}</div>
      {rounds.map((rd,ri) => (<div key={ri}><div style={s.rLabel}>Turno {ri+1}</div>
        {rd.map((m,mi) => {
          const key = `${g}-${ri}-${mi}`;
          const md = results[key];
          const winner = md ? getMatchWinner(md) : null;
          const setsStr = md ? formatSets(md) : "";
          return (
            <div key={mi} style={{...s.mRow, background:winner?C.GREEN+"08":"transparent", padding:"4px 6px", borderRadius:4}}>
              <div style={s.teamName(winner===m[0])}>{m[0]}</div>
              <div style={s.scoreBox}>{setsStr || "—"}</div>
              <div style={{...s.teamName(winner===m[1]),textAlign:"right"}}>{m[1]}</div>
            </div>
          );
        })}</div>))}
    </div>);
  }

  function renderSt(g, standings, acc) {
    return (<div><div style={s.gTitle(acc)}>CLASSIFICA GIRONE {g}</div>
      <table style={s.tbl}>
        <thead><tr>
          <th style={s.th}>#</th><th style={s.th}>SQUADRA</th>
          <th style={s.thR}>G</th><th style={s.thR}>V</th><th style={s.thR}>GF</th><th style={s.thR}>GS</th><th style={s.thR}>DR</th><th style={s.thR}>PT</th>
        </tr></thead>
        <tbody>{standings.map((t,i) => (
          <tr key={t.name} style={{background:i<2?C.GREEN+"10":"transparent"}}>
            <td style={s.pos(i+1)}>{i+1}</td>
            <td style={s.td(i<2)}>{t.name}</td>
            <td style={s.tdR(false)}>{t.played}</td>
            <td style={s.tdR(false)}>{t.wins}</td>
            <td style={s.tdR(false)}>{t.gf}</td>
            <td style={s.tdR(false)}>{t.gs}</td>
            <td style={s.tdR(false)}>{t.gd>0?"+"+t.gd:t.gd}</td>
            <td style={s.tdR(true)}>{t.points}</td>
          </tr>
        ))}</tbody>
      </table>
      <div style={{fontSize:10,color:C.DIM}}>G=Giocate V=Vinte GF=Gol Fatti GS=Gol Subiti DR=Diff.Reti PT=Punti</div>
      <div style={{fontSize:10,color:C.DIM,marginTop:4}}>Parita': scontri diretti avulsi, poi diff.reti avulsa, poi diff.reti generale</div>
    </div>);
  }

  function renderKo(mu) {
    const hn=typeof mu.home==="object"?mu.home?.name:mu.home;
    const an=typeof mu.away==="object"?mu.away?.name:mu.away;
    const md = koResults[mu.id];
    const winner = md?.winner||null;
    const setsStr = md ? formatSets(md) : "";
    const ready = hn && an;
    return (<div key={mu.id} style={s.bM}><div style={s.bL}>{mu.label}</div>
      {ready ? (
        <div style={{...s.mRow,padding:"4px 6px"}}>
          <div style={s.teamName(winner===hn)}>{hn}</div>
          <div style={s.scoreBox}>{setsStr || "—"}</div>
          <div style={{...s.teamName(winner===an),textAlign:"right"}}>{an}</div>
        </div>
      ) : <div style={{fontSize:11,color:C.DIM,fontStyle:"italic"}}>In attesa...</div>}
    </div>);
  }

  return (<div style={s.container}>
    <div style={s.header}>
      <div style={s.title}>Torneo di Biliardino</div>
      <div style={s.subtitle}>12 squadre &bull; 2 gironi &bull; eliminazione diretta</div>
    </div>
    <SyncBar />
    <div style={s.tabs}>
      <button style={s.tab(tab==="gironi")} onClick={()=>setTab("gironi")}>Partite Gironi</button>
      <button style={s.tab(tab==="classifiche")} onClick={()=>setTab("classifiche")}>Classifiche</button>
      <button style={s.tab(tab==="tabellone")} onClick={()=>setTab("tabellone")}>Tabellone</button>
    </div>

    {tab==="gironi" && (<div style={s.twoCol}><div style={s.card}>{renderGM("A",roundsA,C.A)}</div><div style={s.card}>{renderGM("B",roundsB,C.B)}</div></div>)}

    {tab==="classifiche" && (<div style={s.twoCol}><div style={s.card}>{renderSt("A",stA,C.A)}</div><div style={s.card}>{renderSt("B",stB,C.B)}</div></div>)}

    {tab==="tabellone" && (<div style={s.sCol}>
      {!allDone && <div style={{...s.card,textAlign:"center",color:C.GOLD}}>Completa i gironi per sbloccare il tabellone.</div>}
      {allDone && (<>
        <div style={s.bS}><div style={{...s.sT,color:C.A}}>SPAREGGI</div><div style={{fontSize:11,color:C.DIM,marginBottom:10}}>3°-6° posto, incrociati tra gironi</div>{koM.map(renderKo)}</div>
        <div style={s.bS}><div style={{...s.sT,color:C.B}}>QUARTI DI FINALE</div>{qfM.map(renderKo)}</div>
        <div style={s.bS}><div style={{...s.sT,color:C.GOLD}}>SEMIFINALI</div>{sfM.map(renderKo)}</div>
        <div style={s.bS}><div style={{...s.sT,color:C.GOLD}}>FINALE</div>{renderKo(fin)}
          {koResults["final"]?.winner && <div style={s.champ}><div style={{fontSize:12,color:C.DIM,marginBottom:8,letterSpacing:3}}>CAMPIONE</div><div style={s.champN}>{koResults["final"].winner}</div></div>}
        </div>
      </>)}
    </div>)}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
